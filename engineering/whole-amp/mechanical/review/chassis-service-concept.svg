<text x="35" y="40" class="label">RENEGADE — CHASSIS SERVICE ARRANGEMENT</text>
<text x="35" y="68" class="small">CONCEPT ONLY · NOT TO SCALE · NO HOLE POSITIONS OR FIT APPROVAL</text>
<text x="35" y="110" class="label">1  Remove wooden cover</text>
<rect x="40" y="135" width="440" height="230" fill="#d8b970" stroke="#172c38" stroke-width="2"/>
<rect x="64" y="159" width="392" height="182" fill="#f4f1e9" stroke="#172c38" stroke-width="2"/>
