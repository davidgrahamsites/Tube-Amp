<rect x="95" y="200" width="330" height="110" fill="#d9e3e6" stroke="#172c38" stroke-width="2"/>
<text x="130" y="242" class="label">REMOVABLE METAL CHASSIS</text>
<text x="127" y="271" class="small">Functional blocks remain grouped</text>
<circle cx="105" cy="295" r="7" fill="#172c38"/>
<circle cx="415" cy="295" r="7" fill="#172c38"/>
<text x="46" y="395" class="small">Retaining screws face rear; tool approaches from outside.</text>
<text x="46" y="420" class="small">Supports attach to fixed wood only.</text>
<text x="46" y="445" class="small">Wooden cover has no chassis attachment.</text>
<text x="570" y="110" class="label">2  Withdraw chassis; service on bench</text>
<rect x="575" y="255" width="480" height="25" fill="#8aa1ad" stroke="#172c38" stroke-width="2"/>
<rect x="595" y="180" width="335" height="15" fill="#4f8069" stroke="#172c38" stroke-width="2"/>
<rect x="615" y="195" width="10" height="60" fill="#b2b2aa" stroke="#172c38" stroke-width="2"/>
<rect x="900" y="195" width="10" height="60" fill="#b2b2aa" stroke="#172c38" stroke-width="2"/>
<text x="670" y="166" class="small">PCB + components</text>
<text x="620" y="312" class="small">Standoffs on metal carrier</text>
<rect x="965" y="130" width="60" height="85" fill="#b8cbd3" stroke="#172c38" stroke-width="2"/>
<rect x="989" y="215" width="12" height="38" fill="#506b79" stroke="#172c38" stroke-width="2"/>
<circle cx="995" cy="265" r="6" fill="#172c38"/>
<text x="950" y="118" class="small">Driver</text>
<text x="570" y="355" class="small">Flange projects beyond board edge.</text>
<text x="570" y="380" class="small">Keep chuck and body clear, not only the bit.</text>
<text x="570" y="405" class="small">Check access from the screw-head side.</text>
<text x="570" y="430" class="small">Bench support and withdrawal path still need sizing.</text>
<rect x="35" y="485" width="1020" height="165" fill="#ffffff" stroke="#172c38" stroke-width="2"/>
<text x="55" y="516" class="label">RECEIVED DIMENSIONS — ASSEMBLY CHECK STILL OPEN</text>
<text x="55" y="545" class="small">Opening 307–308 × approx. 53 mm; inside height 383 mm. User measurements.</text>
<text x="55" y="572" class="small">Tool clearance: screw-axis distance to obstruction ≥ local tool radius + handling margin.</text>
<text x="55" y="599" class="small">Current board area 109,900 mm² exceeds reported plane 74,720 mm². Repacking required.</text>
<text x="55" y="626" class="small">Rails, fasteners, speaker, tubes, transformers, wiring, guard and full removal sweep remain unverified.</text>
